<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Logga Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!--
  Logga admin portal (logga.space/admin), built from the owner's "Logga Admin Portal" design.
  Sign-in: the app's email code (POST /api/account-exists, then Supabase verifyOtp). Access: Supabase's is_admin()
  (emails on admin_emails, migration 20261029_admin_portal.sql) gates every admin read and write on the server, so
  this page can only ever see what a signed-in admin is allowed to. Data is read straight from Supabase.
-->
<style>
  :root {
    --ink: #1A1F1B; --muted: #565D57; --line: #E4DED1; --line2: #F0EBE0; --bg: #F6F3EC; --card: #FFFFFF;
    --green: #1F5A36; --green-dk: #13241A; --green-lt: #E2EFE4; --amber: #F2A541; --orange: #D9822B;
    --cream: #FFF8EC; --cream-line: #EDD3A6; --brown: #6A3B00; --red-bg: #FBE5DC; --red: #8A2E10;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  a { color: var(--green); } a:hover { color: #143D24; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .display { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .field { height: 44px; padding: 0 14px; border: 1.5px solid #CFC9BB; border-radius: 10px; background: #fff; font-size: 15px; }
  .btn { min-height: 44px; padding: 0 16px; border: 1px solid #CFC9BB; border-radius: 10px; background: #fff; font-size: 14px; }
  .btn-primary { border: 0; background: var(--green); color: #fff; font-weight: 600; }
  .btn-danger { border: 0; background: #A3330D; color: #fff; font-weight: 600; }
  .chip { min-height: 44px; padding: 0 14px; border: 1px solid #CFC9BB; border-radius: 999px; background: #fff; font-size: 14px; }
  .chip[aria-pressed="true"] { border: 0; background: var(--green); color: #fff; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; }
  td { padding: 10px 12px; border-top: 1px solid var(--line2); vertical-align: middle; }
  .tablewrap { overflow-x: auto; }
  @keyframes lgpulse { 0% { box-shadow: 0 0 0 0 rgba(47,140,79,.55) } 70% { box-shadow: 0 0 0 9px rgba(47,140,79,0) } 100% { box-shadow: 0 0 0 0 rgba(47,140,79,0) } }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #2F8C4F; animation: lgpulse 1.8s infinite; }
  .nav-btn { min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #C9D6CC; font-size: 15px; text-align: left; display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .nav-btn[aria-current="page"] { background: #234333; color: #fff; font-weight: 600; }
  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
  .stat { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .bar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; }
  .modal-back { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-back > .shade { position: absolute; inset: 0; border: 0; background: rgba(19,36,26,.55); }
  .modal { position: relative; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; background: #fff; border-radius: 18px; box-shadow: 0 24px 64px rgba(0,0,0,.25); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .xbtn { flex: none; width: 40px; height: 40px; border: 1px solid #CFC9BB; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; }
  label.lbl { font-size: 13px; font-weight: 600; }
  .formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  textarea.field { height: auto; padding: 10px 12px; resize: vertical; font-size: 14px; }
  .alert { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--red-bg); color: var(--red); font-size: 14px; }
  .note { margin: 0; padding: 10px 12px; border-radius: 8px; background: #F7E3C4; color: var(--brown); font-size: 13px; line-height: 1.5; }
  @media (min-width: 800px) { .lg-nav { position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto; } }
  .chart { position: relative; height: 200px; display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid #CFC9BB; }
  .chart .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center" class="muted">Loading…</p></div>

<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://exvbplhajnvuhanykumm.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4dmJwbGhham52dWhhbnlrdW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwODY2NTEsImV4cCI6MjA5MDY2MjY1MX0.L-D_1nnehcjcQZ52XEl0rhKOoUm7HmOMC4_wGIwQETE';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, storageKey: 'logga-admin-auth' } });

  var CATEGORIES = ['Weight Loss Friendly', 'Breakfast', 'Lunch', 'Dinner', 'Snacks', 'Desserts', 'Drinks', 'Weight Loss Drinks', 'Quick & Easy', 'Low Fat', 'Low Carb', 'High Protein'];
  var TILES = ['#1F5A36', '#2E7D4F', '#9A4A0C', '#3C6FB4', '#C2621A', '#5B4A8A', '#8A3B2E', '#2F5F6E'];
  var DAY = 86400000;

  // ---------- state ----------
  var S = {
    phase: 'loading', // loading | email | code | denied | dash
    email: '', code: '', authError: '', busy: false,
    me: null, tab: 'overview', toast: '', modal: null, live: true,
    data: null, loadError: '',
    metric: 'signups', userQuery: '', userFilter: 'All', recipeQuery: '', recipeCountry: 'All', fbFilter: 'Open',
    draft: null, formError: '', bulk: null, newAdmin: '',
    rc: null, plans: {}, customer: {}, menuFor: null, nudge: null,
  };

  // Server actions (delete a user, push a nudge, RevenueCat) live on /api/delete-account with mode 'admin_…';
  // the server checks this login is on the admin list before doing anything.
  async function adminApi(body) {
    var s = (await sb.auth.getSession()).data.session;
    var r = await fetch('/api/delete-account', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (s && s.access_token) }, body: JSON.stringify(body) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
    return j;
  }
  async function loadRevenue() {
    try {
      var rev = await adminApi({ mode: 'admin_revenue' });
      S.rc = rev;
      if (rev.configured && S.data) {
        var p = await adminApi({ mode: 'admin_plans', userIds: S.data.users.map(function (u) { return u.id; }) });
        S.plans = p.plans || {};
      }
    } catch (err) { S.rc = { configured: true, error: err.message }; }
    render();
  }
  var PLAN_STYLE = { Pro: ['#13241A', '#F2A541'], Free: ['#F0EBE0', '#4A4F49'] };
  function planPill(id) { var p = S.plans[id]; if (!p) return '<span class="muted">—</span>'; var s = PLAN_STYLE[p]; return '<span class="pill" style="background:' + s[0] + ';color:' + s[1] + '">' + p + '</span>'; }
  function flagTags(u) { return (u.flags.restricted ? ' <span style="font-size:11px;font-weight:700;color:#8A2E10">RESTRICTED</span>' : '') + (u.flags.flagged ? ' <span style="font-size:11px;font-weight:700;color:#B23E14">FLAGGED</span>' : ''); }

  // ---------- helpers ----------
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function startOfDay(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function ago(t) {
    if (!t) return 'never';
    var s = (Date.now() - t) / 1000;
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    var d = Math.round(s / 86400); return d === 1 ? 'yesterday' : d + ' days ago';
  }
  function dateLabel(t) { return new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
  function initials(name) { return String(name || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0] ? w[0].toUpperCase() : ''; }).join('') || '?'; }
  function nice(max) { if (max <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(max))); var m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
  function riskStyle(r) { return r >= 70 ? ['High', '#FBE5DC', '#8A2E10'] : r >= 40 ? ['Medium', '#F7E3C4', '#6A3B00'] : ['Low', '#E2EFE4', '#1F5A36']; }
  var PLATFORM = { ios: 'iOS', android: 'Android', web: 'Web' };
  function setState(p) { Object.assign(S, p); render(); }
  function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(function () { S.toast = ''; render(); }, 3500); }

  // Every row of a table (Supabase returns 1,000 at a time).
  async function fetchAll(table, columns, build) {
    var out = [], from = 0, size = 1000;
    for (;;) {
      var q = sb.from(table).select(columns).range(from, from + size - 1);
      if (build) q = build(q);
      var res = await q;
      if (res.error) throw new Error(table + ': ' + res.error.message);
      out = out.concat(res.data || []);
      if (!res.data || res.data.length < size) return out;
      from += size;
    }
  }

  // ---------- auth ----------
  async function boot() {
    var res = await sb.auth.getSession();
    var session = res.data && res.data.session;
    if (!session) return setState({ phase: 'email' });
    await afterSignIn(session);
  }
  async function afterSignIn(session) {
    var ok = await sb.rpc('is_admin');
    if (ok.error || ok.data !== true) {
      await sb.auth.signOut();
      return setState({ phase: 'denied', authError: ok.error ? 'Could not check admin access (' + ok.error.message + '). Has the admin portal SQL been run?' : (session.user.email + ' is not on the admin list.') });
    }
    S.me = session.user;
    setState({ phase: 'dash' });
    loadData();
  }
  async function sendCode(e) {
    e && e.preventDefault();
    var email = S.email.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setState({ authError: 'Enter your email address.' });
    setState({ busy: true, authError: '' });
    try {
      // adminOnly: the server emails a code only to admins and answers the same either way
      var r = await fetch('/api/account-exists', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, sendLoginCode: true, adminOnly: true }) });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(j.error || 'Could not send the code.');
      setState({ phase: 'code', busy: false, code: '' });
    } catch (err) { setState({ busy: false, authError: err.message }); }
  }
  async function verifyCode(e) {
    e && e.preventDefault();
    var token = S.code.replace(/\D/g, '');
    if (token.length < 6) return setState({ authError: 'Enter the code from the email.' });
    setState({ busy: true, authError: '' });
    var res = await sb.auth.verifyOtp({ email: S.email.trim().toLowerCase(), token: token, type: 'email' });
    if (res.error) return setState({ busy: false, authError: res.status === 429 ? 'Too many tries. Wait a few minutes.' : "That code isn't right or has expired." });
    S.busy = false;
    await afterSignIn(res.data.session);
  }
  async function signOut() { await sb.auth.signOut(); S.data = null; setState({ phase: 'email', me: null, code: '' }); }

  // ---------- data ----------
  async function loadData(quiet) {
    if (!quiet) setState({ loadError: '' });
    try {
      var since = new Date(Date.now() - 35 * DAY).toISOString();
      var results = await Promise.all([
        fetchAll('profiles', 'id, name, email, country, created_at, goal, daily_calorie_goal, app_prefs'),
        fetchAll('meals', 'id, user_id, name, calories, foods, logged_at, method', function (q) { return q.gte('logged_at', since); }),
        fetchAll('water_logs', 'user_id, logged_at', function (q) { return q.gte('logged_at', since); }),
        fetchAll('check_ins', 'user_id, logged_at', function (q) { return q.gte('logged_at', since); }),
        fetchAll('weight_logs', 'user_id, logged_at', function (q) { return q.gte('logged_at', since); }),
        fetchAll('recipes', 'id, data, published, sort, updated_at', function (q) { return q.order('sort', { ascending: true }); }),
        fetchAll('feedback', 'id, user_id, type, rating, message, email, app_version, created_at, handled', function (q) { return q.order('created_at', { ascending: false }); }),
        fetchAll('admin_emails', 'email, added_at'),
        sb.from('meals').select('id', { count: 'exact', head: true }),
        fetchAll('user_admin_flags', 'user_id, flagged, restricted, note').catch(function () { return []; }),
        fetchAll('admin_settings', 'key, value').catch(function () { return []; }),
      ]);
      var first = !S.data;
      S.data = compute({ profiles: results[0], meals: results[1], water: results[2], checkins: results[3], weights: results[4], recipes: results[5], feedback: results[6], admins: results[7], mealsAllTime: results[8].count || 0, flags: results[9], settings: results[10] });
      S.loadError = '';
      render();
      if (first || !quiet) loadRevenue();
    } catch (err) { setState({ loadError: err.message }); }
  }

  function compute(raw) {
    var now = Date.now(), today = startOfDay(now);
    var users = {};
    raw.profiles.forEach(function (p) {
      var dev = (p.app_prefs && p.app_prefs.device) || {};
      users[p.id] = { id: p.id, name: p.name || (p.email || '').split('@')[0] || 'No name', email: p.email || '', country: p.country || '', goal: p.goal || '',
        joined: p.created_at ? new Date(p.created_at).getTime() : 0, target: p.daily_calorie_goal || 0,
        platform: dev.platform || '', seen: dev.lastSeenAt ? new Date(dev.lastSeenAt).getTime() : 0,
        lastLog: 0, logs7: 0, logsPrev: 0, meals: [], logDays: {}, flags: { flagged: false, restricted: false },
        hasPush: !!(p.app_prefs && p.app_prefs.pushToken && p.app_prefs.pushToken.token) };
    });
    (raw.flags || []).forEach(function (f) { if (users[f.user_id]) users[f.user_id].flags = { flagged: !!f.flagged, restricted: !!f.restricted, note: f.note || '' }; });
    var settings = {}; (raw.settings || []).forEach(function (s) { settings[s.key] = s.value; });
    function touch(row, isMeal) {
      var u = users[row.user_id]; if (!u) return;
      var t = new Date(row.logged_at).getTime(); if (!t) return;
      if (t > u.lastLog) u.lastLog = t;
      if (t >= now - 7 * DAY) u.logs7++; else if (t >= now - 14 * DAY) u.logsPrev++;
      u.logDays[startOfDay(t)] = true;
      if (isMeal) u.meals.push(row);
    }
    raw.meals.forEach(function (m) { touch(m, true); });
    raw.water.forEach(function (r) { touch(r); });
    raw.checkins.forEach(function (r) { touch(r); });
    raw.weights.forEach(function (r) { touch(r); });

    var list = Object.keys(users).map(function (k) { return users[k]; });
    list.forEach(function (u) {
      u.last = Math.max(u.seen, u.lastLog);
      var idle = u.last ? (now - u.last) / DAY : (now - u.joined) / DAY;
      var risk = 0, reason = 'Logging steadily';
      if (idle >= 5) { risk = Math.min(98, Math.round(70 + (idle - 5) * 3)); reason = u.last ? 'No activity for ' + Math.floor(idle) + ' days' : 'Never logged anything'; }
      else if (u.logsPrev >= 4 && u.logs7 <= u.logsPrev / 2) { risk = Math.round(40 + Math.min(29, (1 - u.logs7 / u.logsPrev) * 58)); reason = 'Logging dropped from ' + u.logsPrev + ' to ' + u.logs7 + ' a week'; }
      else if (idle >= 3) { risk = 30; reason = 'Quiet for ' + Math.floor(idle) + ' days'; }
      u.risk = risk; u.reason = reason;
      u.status = idle < 2 ? 'Active' : risk >= 40 ? 'At risk' : 'Quiet';
      var streak = 0, d = today; if (!u.logDays[d]) d -= DAY;
      while (u.logDays[d]) { streak++; d -= DAY; }
      u.streak = streak;
      u.todayKcal = u.meals.filter(function (m) { return new Date(m.logged_at).getTime() >= today; }).reduce(function (s, m) { return s + (m.calories || 0); }, 0);
      u.meals.sort(function (a, b) { return new Date(b.logged_at) - new Date(a.logged_at); });
    });

    var activeNow = list.filter(function (u) { return u.last && now - u.last < 15 * 60 * 1000; }).length;
    var dau = list.filter(function (u) { return u.last >= today; }).length;
    var dauLastWeek = list.filter(function (u) { return u.logDays[today - 7 * DAY]; }).length;
    var mealsToday = raw.meals.filter(function (m) { return new Date(m.logged_at).getTime() >= today; });
    var cohort = list.filter(function (u) { return u.joined >= now - 14 * DAY && u.joined < now - 7 * DAY; });
    var retained = cohort.filter(function (u) { return u.last >= now - 7 * DAY; }).length;

    // 14-day series
    var days = [];
    for (var i = 13; i >= 0; i--) {
      var s0 = today - i * DAY, s1 = s0 + DAY;
      days.push({ t: s0,
        signups: list.filter(function (u) { return u.joined >= s0 && u.joined < s1; }).length,
        active: list.filter(function (u) { return u.logDays[s0]; }).length,
        meals: raw.meals.filter(function (m) { var t = new Date(m.logged_at).getTime(); return t >= s0 && t < s1; }).length });
    }

    // Foods logged today (each food in a meal; a meal without food items counts by its name)
    function foodsOf(m) {
      var f = Array.isArray(m.foods) && m.foods.length ? m.foods : null;
      return f ? f.map(function (x) { return { name: x.name || m.name, cal: Number(x.cal || x.calories || 0) }; }) : [{ name: m.name || 'Meal', cal: m.calories || 0 }];
    }
    function rankFoods(meals) {
      var map = {};
      meals.forEach(function (m) { foodsOf(m).forEach(function (f) {
        var key = String(f.name || '').trim().toLowerCase(); if (!key) return;
        var e = map[key] || (map[key] = { name: String(f.name).trim(), count: 0, kcal: 0 });
        e.count++; e.kcal += f.cal || 0;
      }); });
      return Object.keys(map).map(function (k) { var e = map[k]; e.avg = Math.round(e.kcal / e.count); return e; }).sort(function (a, b) { return b.count - a.count; });
    }
    var foodsToday = rankFoods(mealsToday);

    // Hours today, and meal times (by when it was logged)
    var hours = []; for (var h = 0; h < 24; h++) hours.push(0);
    mealsToday.forEach(function (m) { hours[new Date(m.logged_at).getHours()]++; });
    var slots = { Breakfast: [], Lunch: [], Dinner: [], 'Late snack': [] };
    raw.meals.filter(function (m) { return new Date(m.logged_at).getTime() >= now - 7 * DAY; }).forEach(function (m) {
      var hr = new Date(m.logged_at).getHours();
      (hr >= 5 && hr < 11 ? slots.Breakfast : hr >= 11 && hr < 16 ? slots.Lunch : hr >= 16 && hr < 22 ? slots.Dinner : slots['Late snack']).push(m.calories || 0);
    });

    // Recipe logs (meals logged from a recipe, matched by name, last 35 days)
    var recipeLogs = {};
    raw.meals.forEach(function (m) { if (m.method === 'recipe' && m.name) { var k = m.name.trim().toLowerCase(); recipeLogs[k] = (recipeLogs[k] || 0) + 1; } });

    var goals = {};
    list.forEach(function (u) { var g = u.goal || 'Not set'; goals[g] = (goals[g] || 0) + 1; });

    return { users: list, activeNow: activeNow, dau: dau, dauLastWeek: dauLastWeek, mealsToday: mealsToday.length, mealsAllTime: raw.mealsAllTime,
      retention: cohort.length ? pct(retained, cohort.length) : null, cohortSize: cohort.length,
      signupsToday: list.filter(function (u) { return u.joined >= today; }).length, days: days, foodsToday: foodsToday, hours: hours, slots: slots,
      recipes: raw.recipes, recipeLogs: recipeLogs, feedback: raw.feedback, admins: raw.admins, goals: goals, settings: settings, refreshedAt: now };
  }

  // ---------- views ----------
  function statCard(label, value, sub, dark, onclick) {
    var tag = onclick ? 'button type="button" data-act="' + onclick + '"' : 'div';
    var close = onclick ? 'button' : 'div';
    return '<' + tag + ' class="' + (dark ? '' : 'card ') + 'stat" style="text-align:left;' + (dark ? 'background:#13241A;color:#fff;border-radius:16px;border:0;' : '') + '">' +
      '<span style="font-size:13px;font-weight:500;color:' + (dark ? '#B9CDBC' : '#565D57') + '">' + esc(label) + (onclick ? ' →' : '') + '</span>' +
      '<span class="display" style="font-size:' + (dark ? 44 : 38) + 'px">' + esc(value) + '</span>' +

    var foods = top.map(function (f, i) {

    var storeRow = function (name, n, color, bg) {

    return '<div style="display:flex;flex-direction:column;gap:24px">' +

        viewPlans(D) +

        '</section>' +

          '<h2 style="margin:0;font-size:17px;font-weight:600;color:#5C1F0A">Likely to churn</h2>' +
          '<div><div class="display" style="font-size:52px;color:#5C1F0A">' + atRisk.length + '</div><div style="font-size:14px;color:#6E2A12">' + pct(atRisk.length, total) + '% of all users</div></div>' +
          '<div style="display:flex;flex-direction:column;gap:10px">' +
            '<div style="display:flex;justify-content:space-between;font-size:14px;color:#5C1F0A"><span>High risk (70%+)</span><strong>' + high + '</strong></div><div class="bar" style="background:#F6D0C1"><div style="width:' + pct(high, total) + '%;background:#B23E14"></div></div>' +
            '<div style="display:flex;justify-content:space-between;font-size:14px;color:#5C1F0A"><span>Medium risk (40–69%)</span><strong>' + med + '</strong></div><div class="bar" style="background:#F6D0C1"><div style="width:' + pct(med, total) + '%;background:#D9822B"></div></div>' +

            storeRow('App Store · iOS · Live', plat.ios, '#1F5A36', '#E2EFE4') + storeRow('Play Store · Android · ' + (D.settings.android_live ? 'Live' : 'Coming soon'), plat.android, '#D9822B', '#F0EBE0') + storeRow('Web · logga.space/app', plat.web, '#3C6FB4', '#EAF0F8') +
            '<button type="button" class="btn" style="align-self:flex-start;min-height:40px;font-size:13px" data-act="toggleAndroid">' + (D.settings.android_live ? 'Mark Android as coming soon' : 'Mark Android as live') + '</button>' +

        '</div>' +
      '</div></div>';
  }

  // Free / Pro and revenue, from RevenueCat (metrics overview + each person's active entitlements).
  function viewPlans(D) {
    var rc = S.rc, total = D.users.length;
    var metric = function (id) { return rc && rc.metrics && rc.metrics[id] ? rc.metrics[id].value : null; };
    var known = Object.keys(S.plans).length, pro = Object.keys(S.plans).filter(function (k) { return S.plans[k] === 'Pro'; }).length;
    if (!known && metric('active_subscriptions') != null) pro = metric('active_subscriptions');
    var free = known ? known - pro : (rc && rc.configured ? Math.max(0, total - pro) : null);
    var money = function (v) { return v == null ? '—' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };
    var planCard = function (label, n, dark, sub) {
      return '<div style="' + (dark ? 'background:#13241A;color:#fff;' : 'background:#fff;border:1px solid #E4DED1;') + 'border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;font-weight:600;letter-spacing:.5px;color:' + (dark ? '#F2A541' : '#565D57') + '">' + label + '</span>' +
        '<span class="display" style="font-size:30px">' + (n == null ? '—' : fmt(n)) + '</span><span style="font-size:12px;color:' + (dark ? '#B9CDBC' : '#565D57') + '">' + sub + '</span></div>';
    };

    else if (rc.error) body = '<span style="font-size:13px;color:#8A2E10">RevenueCat: ' + esc(rc.error) + '</span>';

      '<div><div style="font-size:13px;color:#6A3B00;font-weight:600">Monthly recurring revenue</div><div class="display" style="font-size:30px;margin-top:8px">' + money(metric('mrr')) + '</div></div>' +
      '<div><div style="font-size:13px;color:#6A3B00;font-weight:600">Revenue · last 28 days</div><div class="display" style="font-size:30px;margin-top:8px">' + money(metric('revenue')) + '</div></div>' +
      '<div><div style="font-size:13px;color:#6A3B00;font-weight:600">Active trials</div><div class="display" style="font-size:30px;margin-top:8px">' + (metric('active_trials') == null ? '—' : fmt(metric('active_trials'))) + '</div></div></div>';

      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px">' +

        planCard('FREE', free, false, free != null ? pct(free, total) + '% of users' : 'from RevenueCat') + '</div>' +
      '<div style="flex:1 1 auto;background:#FFF8EC;border:1px solid #EDD3A6;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:10px">' + body + '</div></section>';
  }

  function viewUsers(D) {
    var q = S.userQuery.trim().toLowerCase();
    var chips = ['All', 'Active', 'At risk', 'Quiet', 'Pro', 'Free', 'iOS', 'Android', 'Web', 'Flagged', 'Restricted'];
    var rows = D.users.filter(function (u) {
      if (q && (u.name + ' ' + u.email + ' ' + u.country).toLowerCase().indexOf(q) < 0) return false;
      var f = S.userFilter;
      if (f === 'All') return true;
      if (f === 'iOS' || f === 'Android' || f === 'Web') return PLATFORM[u.platform] === f;
      if (f === 'Pro' || f === 'Free') return S.plans[u.id] === f;
      if (f === 'Flagged') return u.flags.flagged;
      if (f === 'Restricted') return u.flags.restricted;
      return u.status === f;
    }).sort(function (a, b) { return b.joined - a.joined; });
    var counts = [

      ['Active', D.users.filter(function (u) { return u.status === 'Active'; }).length, '#E2EFE4', '#C5DECA', '#1F5A36', '#1F5A36'],
      ['At risk', D.users.filter(function (u) { return u.status === 'At risk'; }).length, '#FBE5DC', '#F0C3B0', '#8A2E10', '#5C1F0A'],
      ['Quiet', D.users.filter(function (u) { return u.status === 'Quiet'; }).length, '#F0EBE0', '#E4DED1', '#4A4F49', '#1A1F1B'],
      ['Joined this week', D.users.filter(function (u) { return u.joined >= Date.now() - 7 * DAY; }).length, '#FFF8EC', '#EDD3A6', '#6A3B00', '#1A1F1B'],
      ['Flagged', D.users.filter(function (u) { return u.flags.flagged; }).length, '#fff', '#E4DED1', '#B23E14', '#1A1F1B'],

        '<main style="flex:999 1 560px;min-width:0;padding:32px clamp(16px,3vw,44px) 56px;display:flex;flex-direction:column;gap:28px">' +
          '<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px"><div><h1 class="display" style="margin:0;font-size:38px">' + tab[1] + '</h1><p style="margin:6px 0 0;font-size:15px" class="muted">' + tab[2] + '</p></div>' +
          '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">' + (D ? '<span style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#E2EFE4;color:#1F5A36;font-size:14px;font-weight:600">' + (S.live ? '<span class="live-dot"></span>' : '') + (S.live ? 'Live' : 'Paused') + ' · ' + D.activeNow + ' in app</span>' : '') +
          '<button type="button" class="btn" style="min-height:38px;font-size:13px" data-act="refresh">Refresh</button></div></header>' +
          (S.toast ? '<p role="status" style="margin:0;padding:12px 16px;border-radius:10px;background:#13241A;color:#fff;font-size:14px;font-weight:500">' + esc(S.toast) + '</p>' : '') +
          (S.loadError && D ? '<p class="alert">' + esc(S.loadError) + '</p>' : '') + content + '</main></div>';
      if (S.modal) {
        var m = S.modal, inner = '', width = 560;
        if (m.type === 'user') { var u = D.users.filter(function (x) { return x.id === m.id; })[0]; inner = u ? modalUser(u) : ''; width = 640; }
        else if (m.type === 'recipe') { inner = modalRecipe(); width = 720; }
        else if (m.type === 'addChoice') inner = modalAddChoice();
        else if (m.type === 'bulk') { inner = modalBulk(); width = 720; }
        else if (m.type === 'nudge') inner = modalNudge();
        else if (m.type === 'delUser') { var du = D.users.filter(function (x) { return x.id === m.id; })[0]; inner = modalConfirm('Delete ' + (du ? du.name : 'this user') + '?', "This erases their account, meal logs, photos and progress right away. It can't be undone.", 'confirmDelUser', S.busy ? 'Deleting…' : 'Delete user'); width = 460; }
        else if (m.type === 'delRecipe') { var rr = D.recipes.filter(function (x) { return x.id === m.id; })[0]; inner = modalConfirm('Delete ' + (rr ? rr.data.name : 'this recipe') + '?', "It will disappear from the app for everyone. Past logs stay in people's history.", 'confirmDelRecipe', 'Delete recipe'); width = 460; }
        html += '<div class="modal-back"><button type="button" class="shade" aria-label="Close" data-act="closeModal"></button><div class="modal" role="dialog" aria-modal="true" style="max-width:' + width + 'px">' + inner + '</div></div>';
      }
    }
    app.innerHTML = html;
    if (focusId) { var el = document.getElementById(focusId); if (el) { el.focus(); try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selStart); } catch (_) {} } }
  }

  // ---------- actions ----------
  async function saveRecipe() {
    var d = S.draft;
    var num = function (v) { var n = Number(v); return isFinite(n) && n >= 0 ? Math.round(n * 10) / 10 : 0; };
    if (!d.name.trim()) return setState({ formError: 'Give the recipe a name.' });
    if (!(Number(d.calories) > 0)) return setState({ formError: 'Add the calories per serving.' });
    setState({ busy: true, formError: '' });
    try {
      var imageUrl = d.imageUrl.trim();
      if (d.file) imageUrl = await uploadPhoto(d.file);
      var data = Object.assign({}, d.base, {
        name: d.name.trim(), category: d.category, description: d.description.trim(),
        countries: d.countries.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
        calories: Math.round(num(d.calories)), protein: num(d.protein), carbs: num(d.carbs), fats: num(d.fats),
        prepTime: d.prepTime ? Math.round(num(d.prepTime)) + ' min' : '', cookTime: d.cookTime ? Math.round(num(d.cookTime)) + ' min' : '',
        servings: d.base.servings || 1, yield: d.yield.trim() || '1 serving',
        ingredients: parseIngredients(d.ingredients), instructions: d.instructions.split('\n').map(function (s) { return s.trim(); }).filter(Boolean),
        imageUrl: imageUrl || null,
      });
      if (!data.localNames) data.localNames = {};
      var id = d.id || nextId(), res;
      if (d.id) res = await sb.from('recipes').update({ data: data, published: d.published, updated_at: new Date().toISOString() }).eq('id', id);
      else res = await sb.from('recipes').insert({ id: id, data: data, published: d.published, sort: nextSort() });
      if (res.error) throw new Error(res.error.message);
      S.busy = false; S.modal = null; S.draft = null;
      toast(d.id ? 'Recipe saved.' : 'Recipe added' + (d.published ? ' and published to the app.' : ' as a draft.'));
      loadData(true);
    } catch (err) { setState({ busy: false, formError: err.message }); }
  }
  function parseIngredients(text) {
    return String(text || '').split(/\n|;/).map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
      var m = l.split(/\s+[—–-]\s+|:\s+/);
      return m.length > 1 ? { name: m[0].trim(), amount: m.slice(1).join(' ').trim() } : { name: l, amount: '' };
    });
  }
  function nextId() { return S.data.recipes.reduce(function (mx, r) { return Math.max(mx, r.id); }, 0) + 1; }
  function nextSort() { return S.data.recipes.reduce(function (mx, r) { return Math.max(mx, r.sort || 0); }, 0) + 1; }
  async function uploadPhoto(file) {
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    var path = 'recipe-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    var up = await sb.storage.from('recipe-photos').upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false });
    if (up.error) throw new Error('Photo upload failed: ' + up.error.message);
    return sb.storage.from('recipe-photos').getPublicUrl(path).data.publicUrl;
  }

  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { rej(new Error('Could not load the spreadsheet reader.')); }; document.head.appendChild(s); }); }
  async function readBulk(file) {
    S.bulk = { fileName: file.name, valid: [], errors: [] };
    try {
      if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      var wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
      var rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      if (!rows.length) throw new Error('That file has no rows under the header row.');
      var id = nextId(), sort = nextSort();
      rows.forEach(function (row, i) {
        var g = {}; Object.keys(row).forEach(function (k) { g[String(k).trim().toLowerCase().replace(/[\s-]+/g, '_')] = row[k]; });
        var pick = function () { for (var a = 0; a < arguments.length; a++) { var v = g[arguments[a]]; if (v !== undefined && String(v).trim() !== '') return String(v).trim(); } return ''; };
        var name = pick('name', 'recipe', 'recipe_name', 'title'), kcal = Number(pick('kcal', 'calories', 'cal'));
        if (!name) return S.bulk.errors.push('Row ' + (i + 2) + ': no name');
        if (!(kcal > 0)) return S.bulk.errors.push('Row ' + (i + 2) + ' (' + name + '): no calories');
        var cat = pick('category', 'meal', 'meal_type'); cat = CATEGORIES.filter(function (c) { return c.toLowerCase() === cat.toLowerCase(); })[0] || 'Lunch';
        var n = function () { var v = Number(pick.apply(null, arguments)); return isFinite(v) && v > 0 ? v : 0; };
        var prep = n('prep_min', 'prep', 'prep_time');
        S.bulk.valid.push({ id: id++, sort: sort++, published: /^(y|yes|true|1)$/i.test(pick('published', 'publish')), data: {
          name: name, category: cat, description: pick('description'), countries: pick('country', 'countries').split(',').map(function (s) { return s.trim(); }).filter(Boolean),
          localNames: {}, calories: Math.round(kcal), protein: n('protein_g', 'protein'), carbs: n('carbs_g', 'carbs'), fats: n('fat_g', 'fats', 'fat'),
          prepTime: prep ? prep + ' min' : '', cookTime: '', servings: 1, yield: pick('serving', 'serving_size', 'portion') || '1 serving',
          ingredients: parseIngredients(pick('ingredients').replace(/;/g, '\n')), instructions: pick('steps', 'instructions', 'method').split(';').map(function (s) { return s.trim(); }).filter(Boolean),
          imageUrl: pick('image_url', 'photo', 'image') || null } });
      });
    } catch (err) { S.bulk.error = err.message; }
    render();
  }
  async function importBulk() {
    setState({ busy: true });
    var rows = S.bulk.valid.map(function (r) { return { id: r.id, data: r.data, published: r.published, sort: r.sort }; });
    var res = await sb.from('recipes').insert(rows);
    if (res.error) { S.bulk.error = res.error.message; return setState({ busy: false }); }
    S.busy = false; S.modal = null; var n = rows.length; S.bulk = null;
    toast('Imported ' + n + ' recipes.'); loadData(true);
  }

  var ACT = {
    tab: function (id) { setState({ tab: id, modal: null }); window.scrollTo(0, 0); },
    metric: function (id) { setState({ metric: id }); },
    goUsers: function () { ACT.tab('users'); }, goMeals: function () { ACT.tab('meals'); }, goFoods: function () { ACT.tab('recipes'); },
    goAtRisk: function () { S.userFilter = 'At risk'; ACT.tab('users'); },
    userFilter: function (id) { setState({ userFilter: id }); }, fbFilter: function (id) { setState({ fbFilter: id }); },
    viewUser: function (id) {
      setState({ modal: { type: 'user', id: id }, menuFor: null });
      if (S.rc && S.rc.configured && !S.customer[id]) {
        adminApi({ mode: 'admin_customer', userId: id }).then(function (c) { S.customer[id] = c; render(); }, function (err) { S.customer[id] = { error: err.message }; render(); });
      }
    },
    toggleMenu: function (id) { setState({ menuFor: S.menuFor === id ? null : id }); },
    askNudge: function (id) {
      var u = S.data.users.filter(function (x) { return x.id === id; })[0];
      setState({ menuFor: null, modal: { type: 'nudge' }, nudge: { userIds: [id], label: u ? u.name : 'This person', title: NUDGE_PRESETS[0][0], body: NUDGE_PRESETS[0][1], error: '' } });
    },
    nudgeAtRisk: function () {
      var ids = S.data.users.filter(function (u) { return u.risk >= 40 && !u.flags.restricted; }).map(function (u) { return u.id; });
      setState({ modal: { type: 'nudge' }, nudge: { userIds: ids, label: '', title: NUDGE_PRESETS[0][0], body: NUDGE_PRESETS[0][1], error: '' } });
    },
    nudgePreset: function (i) { var p = NUDGE_PRESETS[Number(i)]; S.nudge.title = p[0]; S.nudge.body = p[1]; render(); },
    toggleFlag: function (id) { setFlag(id, 'flagged'); },
    toggleRestrict: function (id) { setFlag(id, 'restricted'); },
    askDelUser: function (id) { setState({ menuFor: null, modal: { type: 'delUser', id: id } }); },
    confirmDelUser: async function () {
      var id = S.modal.id; setState({ busy: true });
      try {
        await adminApi({ mode: 'admin_delete_user', userId: id });
        S.data.users = S.data.users.filter(function (u) { return u.id !== id; });
        S.busy = false; S.modal = null; toast('User deleted.');
      } catch (err) { S.busy = false; S.modal = null; toast('Could not delete: ' + err.message); }
    },
    toggleAndroid: async function () {
      var live = !S.data.settings.android_live;
      var res = await sb.from('admin_settings').upsert({ key: 'android_live', value: live, updated_at: new Date().toISOString() });
      if (res.error) return toast('Could not save: ' + res.error.message);
      S.data.settings.android_live = live; toast(live ? 'Android marked as live.' : 'Android marked as coming soon.');
    },
    closeModal: function () { setState({ modal: null, draft: null, formError: '', bulk: null, busy: false }); },
    addRecipe: function () { setState({ modal: { type: 'addChoice' }, bulk: null }); },
    pickSingle: function () { setState({ modal: { type: 'recipe' }, draft: draftFrom(null), formError: '' }); },
    pickBulk: function () { setState({ modal: { type: 'bulk' }, bulk: null }); },
    editRecipe: function (id) { var r = S.data.recipes.filter(function (x) { return String(x.id) === id; })[0]; setState({ modal: { type: 'recipe' }, draft: draftFrom(r), formError: '' }); },
    togglePub: async function (id) {
      var r = S.data.recipes.filter(function (x) { return String(x.id) === id; })[0]; if (!r) return;
      var res = await sb.from('recipes').update({ published: !r.published, updated_at: new Date().toISOString() }).eq('id', r.id);
      if (res.error) return toast('Could not change it: ' + res.error.message);
      r.published = !r.published; toast(r.published ? r.data.name + ' is now in the app.' : r.data.name + ' is hidden from the app.');
    },
    askDelRecipe: function (id) { setState({ modal: { type: 'delRecipe', id: Number(id) } }); },
    confirmDelRecipe: async function () {
      var id = S.modal.id, res = await sb.from('recipes').delete().eq('id', id);
      if (res.error) return toast('Could not delete it: ' + res.error.message);
      S.data.recipes = S.data.recipes.filter(function (r) { return r.id !== id; }); S.modal = null; toast('Recipe deleted.');
    },
    importBulk: function () { importBulk(); },
    toggleFb: async function (id) {
      var f = S.data.feedback.filter(function (x) { return String(x.id) === id; })[0]; if (!f) return;
      var res = await sb.from('feedback').update({ handled: !f.handled }).eq('id', f.id);
      if (res.error) return toast('Could not update it: ' + res.error.message);
      f.handled = !f.handled; render();
    },
    removeAdmin: async function (email) {
      var res = await sb.from('admin_emails').delete().eq('email', email);
      if (res.error) return toast('Could not remove: ' + res.error.message);
      S.data.admins = S.data.admins.filter(function (a) { return a.email !== email; }); toast(email + ' removed.');
    },
    toggleLive: function () { setState({ live: !S.live }); },
    refresh: function () { loadData(); toast('Refreshing…'); },
    signOut: function () { signOut(); },
    backToEmail: function () { setState({ phase: 'email', authError: '', code: '' }); },
  };
  async function setFlag(id, field) {
    var u = S.data.users.filter(function (x) { return x.id === id; })[0]; if (!u) return;
    var next = Object.assign({ flagged: false, restricted: false }, u.flags); next[field] = !next[field];
    S.menuFor = null;
    var res = await sb.from('user_admin_flags').upsert({ user_id: id, flagged: next.flagged, restricted: next.restricted, updated_at: new Date().toISOString() });
    if (res.error) return toast('Could not save: ' + res.error.message);
    u.flags = next;
    toast(field === 'flagged' ? (next.flagged ? u.name + ' is flagged.' : 'Flag removed.') : (next.restricted ? u.name + "'s account is on hold: the app shows them a restricted screen." : u.name + ' can use Logga again.'));
  }
  var FORMS = {
    sendCode: sendCode, verifyCode: verifyCode, saveRecipe: function () { saveRecipe(); },
    sendNudge: async function () {
      var n = S.nudge;
      if (!n.title.trim() || !n.body.trim()) { n.error = 'Add a title and a message.'; return render(); }
      setState({ busy: true });
      try {
        var r = await adminApi({ mode: 'admin_nudge', userIds: n.userIds, title: n.title.trim(), body: n.body.trim() });
        S.busy = false; S.modal = null; S.nudge = null;
        toast('Nudge sent to ' + r.saved + (r.saved === 1 ? ' person' : ' people') + (r.pushed ? ' (' + r.pushed + ' by push right now, the rest when they open Logga).' : '. They will see it when they next open Logga.'));
      } catch (err) { n.error = err.message; setState({ busy: false }); }
    },
    addAdmin: async function () {
      var email = S.newAdmin.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Enter an email address.');
      var res = await sb.from('admin_emails').insert({ email: email });
      if (res.error) return toast('Could not add: ' + res.error.message);
      S.newAdmin = ''; S.data.admins.push({ email: email }); toast(email + ' can now sign in.');
    },
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) { if (S.menuFor && !e.target.closest('[role="menu"]')) setState({ menuFor: null }); return; }
    var fn = ACT[b.getAttribute('data-act')]; if (fn) { e.preventDefault(); fn(b.getAttribute('data-id')); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('[data-form]'); if (!f) return;
    e.preventDefault(); var fn = FORMS[f.getAttribute('data-form')]; if (fn) fn(e);
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-input')) { S[t.getAttribute('data-input')] = t.value; if (t.tagName === 'SELECT' || /Query$/.test(t.getAttribute('data-input'))) render(); }
    if (t.hasAttribute('data-draft') && S.draft) S.draft[t.getAttribute('data-draft')] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.hasAttribute('data-nudge') && S.nudge) S.nudge[t.getAttribute('data-nudge')] = t.value;
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-draft') && S.draft && t.type === 'checkbox') S.draft.published = t.checked;
    if (t.getAttribute('data-file') === 'photo' && t.files[0]) { S.draft.file = t.files[0]; render(); }
    if (t.getAttribute('data-file') === 'bulk' && t.files[0]) readBulk(t.files[0]);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.modal) ACT.closeModal(); });

  setInterval(function () { if (S.phase === 'dash' && S.live && !S.modal && document.visibilityState === 'visible') loadData(true); }, 30000);
  boot().catch(function (err) { setState({ phase: 'email', authError: err.message }); });
})();
</script>
</body>
</html>
