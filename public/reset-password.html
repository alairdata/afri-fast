<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password - Logga</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fbfbf7; color: #10201a; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    main { width: 100%; max-width: 400px; padding: 32px 24px; text-align: center; }
    img { width: 130px; height: auto; margin-bottom: 22px; }
    h1 { font-size: 26px; letter-spacing: -0.03em; margin: 0 0 8px; }
    p.sub { font-size: 15px; line-height: 1.55; color: #5b6b64; margin: 0 0 22px; }
    label { display: block; text-align: left; font-size: 12px; font-weight: 700; color: rgba(16,32,26,0.6); margin: 14px 0 6px 2px; }
    input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 15px 14px; border-radius: 14px; border: 1.5px solid rgba(0,0,0,0.12); background: #fff; color: #10201a; }
    input:focus { outline: none; border-color: #059669; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; text-align: left; font-size: 12.5px; color: rgba(16,32,26,0.5); }
    .meter { text-align: left; margin-top: 12px; }
    .bars { display: flex; gap: 6px; }
    .bars i { flex: 1; height: 4px; border-radius: 2px; background: #e5e7eb; }
    #meterLabel { margin-top: 6px; font-size: 12.5px; font-weight: 600; }
    button, a.btn { display: block; width: 100%; box-sizing: border-box; margin-top: 22px; background: #059669; color: #fff; text-decoration: none; font-size: 16px; font-weight: 700; padding: 16px; border: 0; border-radius: 14px; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: default; }
    .msg { margin-top: 16px; font-size: 13.5px; line-height: 1.5; border-radius: 12px; padding: 10px 12px; }
    .err { color: #b91c1c; background: #fef2f2; }
    .hide { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="/logga-wordmark.png" alt="Logga">

    <div id="form">
      <h1>Choose a new password</h1>
      <p class="sub">Pick something strong. You'll use it to log in to Logga.</p>
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password">
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password">
      <div id="meter" class="meter hide"><div class="bars"><i></i><i></i><i></i><i></i></div><div id="meterLabel"></div></div>
      <div id="err" class="msg err hide"></div>
      <button id="go" disabled>Reset password</button>
    </div>

    <div id="done" class="hide">
      <h1>Password reset</h1>
      <p class="sub" id="doneText"></p>
      <a class="btn" href="logga://auth-callback?verified=true">Open Logga</a>
    </div>

    <div id="bad" class="hide">
      <h1>Link expired</h1>
      <p class="sub">Reset link has expired. Please request a new one from the Logga login screen.</p>
      <a class="btn" href="logga://auth-callback">Open Logga</a>
    </div>
  </main>
  <script>
    // Supabase sends the person here with a one-time access token in the URL fragment.
    (function () {
      var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      var token = params.get('access_token');
      // New links carry a code in the query string that is only spent when the new password is submitted.
      var tokenHash = new URLSearchParams(location.search).get('token_hash');
      var show = function (id) { ['form', 'done', 'bad'].forEach(function (x) { document.getElementById(x).classList.toggle('hide', x !== id); }); };
      if ((!token && !tokenHash) || params.get('error')) { show('bad'); return; }
      // Keep the token out of the address bar and history once we have it.
      history.replaceState(null, '', location.pathname);

      var pw = document.getElementById('pw'), pw2 = document.getElementById('pw2'), go = document.getElementById('go'), err = document.getElementById('err');
      function strength(p) {
        if (p.length < 8) return { level: 1, label: 'Too short, use 8+ characters', color: '#ef4444' };
        var classes = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(function (r) { return r.test(p); }).length;
        var score = 1;
        if (p.length >= 12) score++;
        if (classes >= 3) score++;
        if (p.length >= 16 || (classes === 4 && p.length >= 12)) score++;
        score = Math.min(score, 4);
        return [null,
          { level: 1, label: 'Weak, but you can use it', color: '#ef4444' },
          { level: 2, label: 'Okay', color: '#f59e0b' },
          { level: 3, label: 'Good', color: '#84cc16' },
          { level: 4, label: 'Strong', color: '#059669' }][score];
      }
      function check() {
        var meter = document.getElementById('meter');
        if (!pw.value) { meter.classList.add('hide'); }
        else {
          var st = strength(pw.value);
          meter.classList.remove('hide');
          meter.querySelectorAll('i').forEach(function (bar, i) { bar.style.background = i < st.level ? st.color : '#e5e7eb'; });
          var label = document.getElementById('meterLabel');
          label.textContent = st.label; label.style.color = st.color;
        }
        go.disabled = !(pw.value.length >= 8 && pw.value === pw2.value);
      }
      pw.addEventListener('input', check);
      pw2.addEventListener('input', check);

      go.addEventListener('click', function () {
        go.disabled = true;
        err.classList.add('hide');
        fetch('https://afri-fast.vercel.app/api/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(token ? { accessToken: token, password: pw.value } : { tokenHash: tokenHash, password: pw.value })
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (res.ok) { document.getElementById('doneText').textContent = res.d.message; show('done'); }
            else { err.textContent = res.d.error || 'Something went wrong. Please try again.'; err.classList.remove('hide'); check(); }
          })
          .catch(function () { err.textContent = "Couldn't reach Logga. Check your connection and try again."; err.classList.remove('hide'); check(); });
      });
    })();
  </script>
</body>
</html>
